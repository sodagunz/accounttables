name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (defaults to latest)
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve ref
        run: |
          ref="${REF:-$(git describe --tags --abbrev=0 2>/dev/null || echo "${{ github.event.repository.default_branch }}")}"
          git checkout "$ref"
          echo "deploying $ref"
        env:
          REF: ${{ inputs.tag || github.ref_name || '' }}

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - run: nix run .#build-release

      - run: nix run .#deploy
