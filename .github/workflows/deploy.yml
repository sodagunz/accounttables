name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (defaults to latest)
        required: false
        default: ""
      dry-run:
        description: Validate deploy without publishing changes
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolve ref
        run: |
          ref="${REF:-$(git describe --tags --abbrev=0 2>/dev/null || echo "${{ github.event.repository.default_branch }}")}"
          git checkout "$ref"
          echo "deploying $ref"
        env:
          REF: ${{ inputs.tag || github.ref_name || '' }}

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix run .#build-release

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: contabilizar-78c2d
          create_credentials_file: true
          export_environment_variables: true

      - name: deploy
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs['dry-run'] }}
        run: nix run .#deploy

      - name: deploy dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] }}
        run: nix run .#deploy -- --dry-run
