<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContabilizAR</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f8f7;
        color: #1e2422;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        background: #17352c;
        color: #ffffff;
        padding: 24px clamp(16px, 4vw, 40px);
      }

      .topbar__inner {
        max-width: 1320px;
        margin: 0 auto;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 4.25rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 10px;
        color: #d6e6df;
        max-width: 720px;
        line-height: 1.45;
      }

      main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px clamp(16px, 4vw, 40px) 48px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #dce4e0;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(20, 34, 30, 0.06);
      }

      .panel {
        padding: 18px;
      }

      .section-title {
        font-size: 1rem;
        margin-bottom: 14px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #46524e;
        font-size: 0.9rem;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #bfcbc6;
        border-radius: 6px;
        padding: 10px 11px;
        color: #1e2422;
        background: #ffffff;
      }

      input:focus,
      select:focus {
        outline: 2px solid #2f806c;
        outline-offset: 1px;
        border-color: #2f806c;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .conversion {
        background: #eef5f2;
        border-radius: 6px;
        padding: 12px;
        color: #29443c;
        line-height: 1.4;
      }

      .rate-status {
        border: 1px solid #d7e4df;
        border-radius: 6px;
        background: #f8faf9;
        color: #46524e;
        font-size: 0.9rem;
        line-height: 1.4;
        padding: 10px 12px;
      }

      .rate-status strong {
        color: #17352c;
        font-weight: 800;
      }

      .rate-status__meta {
        margin-top: 4px;
        color: #68756f;
      }

      .error {
        color: #9f2e2e;
        min-height: 1.3em;
      }

      .primary {
        border: 0;
        border-radius: 6px;
        background: #2f806c;
        color: #ffffff;
        padding: 11px 14px;
        cursor: pointer;
      }

      .primary:hover {
        background: #276d5c;
      }

      .content-stack {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .filters {
        display: grid;
        gap: 12px;
      }

      .table-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .filter-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-button {
        border: 1px solid #c8d4cf;
        border-radius: 6px;
        background: #ffffff;
        color: #33413c;
        padding: 8px 10px;
        cursor: pointer;
      }

      .filter-button:hover {
        border-color: #2f806c;
      }

      .filter-button--active {
        border-color: #2f806c;
        background: #e7f2ee;
        color: #17352c;
        font-weight: 700;
      }

      .date-mode {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }

      .date-mode p {
        color: #5e6b66;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .export-controls {
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .export-controls p {
        color: #5e6b66;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .custom-range {
        display: grid;
        grid-template-columns: repeat(2, minmax(160px, 220px));
        gap: 12px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
      }

      th,
      td {
        padding: 11px 10px;
        border-bottom: 1px solid #e4ebe7;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: #4c5b55;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .sort-button {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: inherit;
        padding: 0;
        text-align: inherit;
        white-space: nowrap;
      }

      .sort-button:hover,
      .sort-button--active {
        color: #17352c;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      td.numeric,
      th.numeric {
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .equivalence {
        width: 32px;
        color: #68756f;
        text-align: center;
        white-space: nowrap;
      }

      td:first-child,
      th:first-child {
        white-space: nowrap;
      }

      .subtotal td {
        background: #f8faf9;
        color: #2f3d38;
        font-weight: 700;
      }

      .grand-total td {
        background: #eef5f2;
        border-top: 2px solid #2f806c;
        color: #17352c;
        font-weight: 800;
      }

      .empty {
        color: #697771;
        padding: 22px 0;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 520px) {
        .topbar {
          padding-top: 20px;
          padding-bottom: 20px;
        }

        main {
          padding-top: 16px;
        }

        .two-col {
          grid-template-columns: 1fr;
        }

        .custom-range {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="elm.js"></script>
    <script>
      const app = Elm.Main.init({ node: document.getElementById("app") });

      app.ports.exportTable.subscribe((payload) => {
        if (payload.format === "xlsx" && window.XLSX) {
          downloadXlsx(payload);
        } else {
          downloadCsv({
            ...payload,
            filename: payload.filename.replace(/\.xlsx$/i, ".csv"),
          });
        }
      });

      function downloadCsv(payload) {
        const lines = [payload.headers, ...payload.rows.map((row) => row.cells)];
        const csv = lines.map((row) => row.map(escapeCsv).join(",")).join("\r\n");
        downloadBlob(payload.filename, "text/csv;charset=utf-8", "\uFEFF" + csv);
      }

      function downloadXlsx(payload) {
        const rows = [payload.headers, ...payload.rows.map((row) => row.cells)];
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        const range = XLSX.utils.decode_range(worksheet["!ref"]);

        worksheet["!cols"] = [
          { wch: 18 },
          { wch: 14 },
          { wch: 28 },
          { wch: 16 },
          { wch: 16 },
          { wch: 18 },
          { wch: 4 },
          { wch: 18 },
        ];

        worksheet["!freeze"] = { xSplit: 0, ySplit: 1 };
        worksheet["!autofilter"] = { ref: worksheet["!ref"] };

        for (let column = range.s.c; column <= range.e.c; column += 1) {
          const cell = worksheet[XLSX.utils.encode_cell({ r: 0, c: column })];
          if (cell) {
            cell.s = { font: { bold: true }, fill: { fgColor: { rgb: "EEF5F2" } } };
          }
        }

        payload.rows.forEach((row, index) => {
          if (row.type === "subtotal" || row.type === "total") {
            for (let column = range.s.c; column <= range.e.c; column += 1) {
              const cell = worksheet[XLSX.utils.encode_cell({ r: index + 1, c: column })];
              if (cell) {
                cell.s = { font: { bold: true }, fill: { fgColor: { rgb: row.type === "total" ? "E7F2EE" : "F8FAF9" } } };
              }
            }
          }
        });

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, payload.sheetName || "Gastos");
        XLSX.writeFile(workbook, payload.filename);
      }

      function escapeCsv(value) {
        const text = String(value ?? "");
        if (/[",\r\n]/.test(text)) {
          return `"${text.replace(/"/g, '""')}"`;
        }

        return text;
      }

      function downloadBlob(filename, mimeType, content) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
